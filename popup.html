<!DOCTYPE html>

<html lang="ru">

<head>

    <meta charset="UTF-8">

    <title>VSOL Scout</title>

    <link rel="stylesheet" href="popup.css">

</head>

<body>

<div class="container">

    <div class="title">
        VSOL Scout
    </div>

    <div class="version">
        v0.1.2 — разведка
    </div>

    <button id="scan">
        🔎 Сканировать матч
    </button>

    <div id="status" class="status">
        Откройте страницу подготовки к матчу
    </div>

    <div id="result" class="hidden">

        <div class="section">
            <div class="section-title">
                Матч
            </div>

            <div id="matchInfo"></div>
        </div>

        <div class="section">
            <div class="section-title">
                Состав
            </div>

            <div id="squadInfo"></div>
        </div>

        <div class="section">
            <div class="section-title">
                Разведка
            </div>

            <div id="scoutInfo"></div>
        </div>

        <button
            id="download"
            class="secondary"
        >
            💾 Скачать разведку
        </button>

    </div>

</div>

<script src="popup.js"></script>

</body>

</html>
