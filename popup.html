<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <title>VSOL Scout</title>

    <link rel="stylesheet" href="popup.css">

</head>

<body>

    <div class="container">

        <div class="title">
            VSOL Scout
        </div>

        <div class="version">
            v0.1.1
        </div>

        <button id="collect">
            📊 Получить данные матча
        </button>

        <div id="status" class="status">
            Откройте страницу подготовки к матчу
        </div>

        <div id="result" class="result hidden">

            <div id="matchInfo"></div>

            <div id="playerInfo"></div>

            <button id="download" class="secondary">
                💾 Скачать JSON
            </button>

            <button id="copy" class="secondary">
                📋 Скопировать JSON
            </button>

        </div>

    </div>

    <script src="popup.js"></script>

</body>

</html>
